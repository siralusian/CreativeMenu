plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
    id 'com.modrinth.minotaur' version '2.+'
    id 'net.darkhax.curseforgegradle' version '1.1.+'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = "2024.11.17"
        minecraftVersion = "1.21.1"
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

processResources {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Modrinth/CurseForge-Upload (Nutzer-Vorgabe: Tokens NIEMALS im Repo, ausschliesslich aus den
// lokalen Umgebungsvariablen MODRINTH_TOKEN/CURSEFORGE_TOKEN gelesen - fehlen sie, brechen die
// beiden Tasks unten kontrolliert ab statt mit leerem Token einen Request zu schicken. Aufruf
// bewusst manuell (./gradlew modrinth / ./gradlew publishCurseForge), kein automatischer Trigger
// an build/publish gekoppelt.
modrinth {
    token = providers.environmentVariable('MODRINTH_TOKEN')
    projectId = modrinth_id
    versionNumber = mod_version
    versionType = "release"
    uploadFile = tasks.named('jar')
    gameVersions = [minecraft_version]
    loaders = ["neoforge"]
    changelog = file("$rootDir/CHANGELOG.md").text
    syncBodyFrom = file("$rootDir/README.md").text
}

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = providers.environmentVariable('CURSEFORGE_TOKEN').getOrElse('')
    disableVersionDetection()

    def mainFile = upload(curseforge_id, tasks.named('jar'))
    mainFile.changelog = file("$rootDir/CHANGELOG.md").text
    mainFile.changelogType = 'markdown'
    mainFile.releaseType = 'release'
    mainFile.addModLoader('NeoForge')
    mainFile.addGameVersion(minecraft_version)
    // CurseForge verlangt zusaetzlich zu Spielversion/Loader mindestens ein "Environment"-Tag aus
    // der Gruppe Client/Server ("Both" ist selbst kein gueltiger Wert, siehe Live-Fund bei
    // CobbleCompanion) - beide einzeln gesetzt.
    mainFile.addEnvironment('Client')
    mainFile.addEnvironment('Server')
    mainFile.displayName = "${mod_name} ${mod_version}"
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
